# Boot-time module force-loads for the air unit (P1_SKY), processed by the OpenRC `modules`
# service. Everything with a DT node coldplugs from mdev/hwdrivers (RF SDIO, SD, wave5 codec);
# this file force-loads the ones without a DT node or whose coldplug fallback is unsafe.
#
# vs the goggle: NO panel (no display), NO ml_dmablit (RX compositor), NO ar_scaler yet.

# mmz dma-heap (/dev/dma_heap/mmz): the wave5 encoder's pool. Has a DT node
# (missinglynk,mmz-heap) so coldplug should load it, but force-load anyway - the fallback on a
# missing heap is a SILENT drop to the small CMA heap, the exact exhaustion this exists to fix.
ml_mmzheap

# Camera capture chain: sensor, CSI-2 receiver, VIF input, ISP, CVISP output stage. All five have
# DT nodes and should coldplug, but they are force-loaded because the failure is quiet: ar-vif
# waits on an async subdev notifier, so a sensor module that never loads leaves the graph
# unbound and the capture node simply never appears. ml-air-camera then finds no node and the
# unit boots healthy with no video.
#
# Listed source-first. modprobe resolves the symbol dependencies either way; the order is for
# the reader, and matches the bring-up order the drivers themselves use.
nt99235
ar-csi2
ar-vif
ar-isp
ar-cvisp
